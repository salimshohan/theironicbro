<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ironic Bro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* --- Global Styles (Deep Purple Theme from TIB) --- */
        :root {
            --bg-body: #130a1f;       /* Deep dark purple background */
            --bg-card: #23123a;       /* Lighter purple for Cards */
            
            --primary: #a855f7;       /* Electric/Neon Purple */
            --text-main: #f3e8ff;     /* Light purple-tinted white */
            --text-muted: #d8b4fe;    /* Soft Muted Purple */
            --border: #581c87;        /* Purple Border */
        }

        /* --- Content Protection & Flex Layout --- */
        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            font-family: 'Segoe UI', sans-serif;
            -webkit-user-select: none; user-select: none; /* No Copy */
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        a { text-decoration: none; color: inherit; transition: 0.3s; }
        img { pointer-events: none; }

        /* --- Main Content --- */
        .container { 
            margin-top: 80px; /* Space for external header */
            width: 100%; max-width: 1100px; 
            padding: 0 20px; 
            flex: 1; /* Pushes footer to bottom */
        }
        .section-title { font-size: 2rem; margin-bottom: 40px; border-left: 5px solid var(--primary); padding-left: 15px; font-weight: 700; }

        .blog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; margin-bottom: 50px; }

        /* --- Awesome Card Animation --- */
        .blog-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; overflow: hidden;
            position: relative; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Bouncy Hover */
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Hover Effect */
        .blog-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(168, 85, 247, 0.25); /* Purple Glow */
        }
        
        .blog-img { width: 100%; height: 220px; object-fit: cover; opacity: 0.9; transition: 0.3s; }
        .blog-card:hover .blog-img { opacity: 1; transform: scale(1.05); }

        .blog-content { padding: 25px; }
        .blog-date { font-size: 0.85rem; color: var(--primary); margin-bottom: 10px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        .blog-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; line-height: 1.3; color: #fff; }
        .blog-desc { font-size: 1rem; color: var(--text-muted); line-height: 1.6; }

        /* Click Ripple Effect (Active State) */
        .blog-card:active {
            transform: scale(0.95); /* Press down effect */
            transition: 0.1s;
        }

        /* --- Load More Button (See More) --- */
        .load-more-container { text-align: center; margin-bottom: 50px; margin-top: 20px; }
        
        .see-more-btn {
            padding: 14px 40px;
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--text-main);
            cursor: pointer;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .see-more-btn:hover {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.6); /* Neon Purple Button Glow */
            transform: translateY(-3px);
        }
        
        .fa-spinner { margin-right: 8px; }

        /* --- Footer (IL Style UI) --- */
        footer {
            width: 100%; padding: 15px; text-align: center;
            background: #1f2937;
            border-top: 1px solid #dadada;
            margin-top: auto; font-size: 14px; color: white;
        }

        @media (max-width: 768px) {
            .container { margin-top: 60px; padding: 20px; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="header"></div>
    <script type="text/javascript" src="/js/header.js"></script>

    <div class="container">
        <div class="section-title">Fresh Drops</div>

        <div class="blog-grid" id="blogContainer">
            <p style="color: var(--text-muted);">Loading awesome memes...</p>
        </div>

        <div class="load-more-container">
            <button id="seeMoreBtn" class="see-more-btn" onclick="loadMorePosts()" style="display: none;">
                See More <i class="fas fa-angle-down"></i>
            </button>
        </div>
    </div>

    <footer>&copy; 2026 The Ironic Bro<br>All rights reserved.</footer>

    <script>
        // Prevent Copy/Inspect
        document.onkeydown = function(e) {
            if(event.keyCode == 123) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        }

        // Post Logic (Reverse Order + See More)
        let allPosts = [];
        let visiblePostsCount = 0; 
        const postsPerBatch = 15;  

        async function initPosts() {
            const container = document.getElementById('blogContainer');
            try {
                const response = await fetch('posts.json');
                if (!response.ok) throw new Error("JSON not found");
                
                allPosts = await response.json();
                allPosts.reverse(); // Latest on Top

                container.innerHTML = '';
                loadMorePosts();

            } catch (error) {
                container.innerHTML = `<p style="color: var(--primary);">Error: posts.json not found.</p>`;
            }
        }

        function loadMorePosts() {
            const container = document.getElementById('blogContainer');
            const seeMoreBtn = document.getElementById('seeMoreBtn');

            const start = visiblePostsCount;
            const end = visiblePostsCount + postsPerBatch;
            const postsToRender = allPosts.slice(start, end);

            postsToRender.forEach(post => {
                const card = `
                    <div class="blog-card" onclick="window.location.href='${post.link}'">
                        <img src="${post.image}" alt="${post.title}" class="blog-img">
                        <div class="blog-content">
                            <div class="blog-date">${post.date}</div>
                            <h3 class="blog-title">${post.title}</h3>
                            <p class="blog-desc">${post.excerpt}</p>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', card);
            });

            visiblePostsCount += postsToRender.length;

            if (visiblePostsCount >= allPosts.length) {
                seeMoreBtn.style.display = 'none';
            } else {
                seeMoreBtn.style.display = 'inline-block';
            }
        }

        document.addEventListener('DOMContentLoaded', initPosts);
    </script>
</body>
</html>
