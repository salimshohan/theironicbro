<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ironic Bro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* --- Global Styles (Smart Light Mode) --- */
        :root {
            --bg-body: #f8fafc;       /* Light slate/grayish white */
            --bg-card: #ffffff;       /* Pure white for cards */
            
            --primary: #4f46e5;       /* Smart Indigo */
            --primary-hover: #4338ca; /* Darker Indigo for hover */
            
            --text-main: #0f172a;     /* Dark Slate (almost black) */
            --text-muted: #64748b;    /* Medium Gray */
            --border: #e2e8f0;        /* Light subtle border */
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* --- Layout & Background --- */
        body { 
            background-color: var(--bg-body); 
            /* Subtle dotted pattern for a smart tech look */
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main); 
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-user-select: none; user-select: none; /* No Copy */
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        a { text-decoration: none; color: inherit; transition: 0.3s; }
        img { pointer-events: none; }

        /* --- Main Content --- */
        .container { 
            margin-top: 80px; /* Space for external header */
            width: 100%; max-width: 1100px; 
            padding: 0 20px; 
            flex: 1; /* Pushes footer to bottom */
        }
        
        .section-title { 
            font-size: 2rem; 
            margin-bottom: 40px; 
            border-left: 5px solid var(--primary); 
            padding-left: 15px; 
            font-weight: 700; 
            color: var(--text-main);
        }

        .blog-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 30px; 
            margin-bottom: 50px; 
        }

        /* --- Modern Smart Card --- */
        .blog-card {
            background: var(--bg-card); 
            border: 1px solid var(--border);
            border-radius: 16px; 
            overflow: hidden;
            position: relative; cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
        }

        /* Hover Effect */
        .blog-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: var(--shadow-lg);
        }
        
        .blog-img { 
            width: 100%; height: 220px; 
            object-fit: cover; 
            transition: transform 0.5s ease; 
        }
        .blog-card:hover .blog-img { transform: scale(1.05); }

        .blog-content { padding: 25px; background: #fff; position: relative; z-index: 2; }
        .blog-date { 
            font-size: 0.85rem; color: var(--primary); 
            margin-bottom: 10px; text-transform: uppercase; 
            font-weight: 700; letter-spacing: 1px; 
        }
        .blog-title { 
            font-size: 1.4rem; font-weight: 700; 
            margin-bottom: 10px; line-height: 1.3; 
            color: var(--text-main); 
        }
        .blog-desc { 
            font-size: 1rem; color: var(--text-muted); 
            line-height: 1.6; 
        }

        .blog-card:active {
            transform: scale(0.98); 
            transition: 0.1s;
        }

        /* --- Load More Button --- */
        .load-more-container { text-align: center; margin-bottom: 50px; margin-top: 20px; }
        
        .see-more-btn {
            padding: 14px 40px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            color: var(--text-main);
            cursor: pointer;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: var(--shadow-sm);
        }
        
        .see-more-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        
        .fa-spinner { margin-right: 8px; }

        /* --- Footer (IL Style UI with Back to Top) --- */
        footer {
            width: 100%; padding: 25px 15px; text-align: center;
            background: #ffffff;
            border-top: 1px solid var(--border);
            margin-top: auto; font-size: 14px; color: var(--text-muted);
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.02);
            position: relative;
        }
        
        .footer-content { margin-bottom: 15px; font-weight: 500; }
        .footer-content strong { color: var(--text-main); }

        /* Back to Top Button in Footer */
        .back-to-top {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-md);
            border: none;
        }

        .back-to-top:hover {
            background: var(--primary-hover);
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        @media (max-width: 768px) {
            .container { margin-top: 60px; padding: 20px; }
            .blog-grid { gap: 20px; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="header"></div>
    <script type="text/javascript" src="/js/header.js"></script>

    <div class="container">
        <div class="section-title">Fresh Drops</div>

        <div class="blog-grid" id="blogContainer">
            <p style="color: var(--text-muted);">Loading awesome posts...</p>
        </div>

        <div class="load-more-container">
            <button id="seeMoreBtn" class="see-more-btn" onclick="loadMorePosts()" style="display: none;">
                See More <i class="fas fa-angle-down"></i>
            </button>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            &copy; 2026 <strong>The Ironic Bro</strong><br>All rights reserved.
        </div>
        <button class="back-to-top" onclick="scrollToTop()" title="Back to Top">
            <i class="fas fa-arrow-up"></i>
        </button>
    </footer>

    <script>
        // Back to Top Functionality
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // Prevent Copy/Inspect
        document.onkeydown = function(e) {
            if(event.keyCode == 123) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        }

        // Post Logic (Reverse Order + See More)
        let allPosts = [];
        let visiblePostsCount = 0; 
        const postsPerBatch = 15;  

        async function initPosts() {
            const container = document.getElementById('blogContainer');
            try {
                const response = await fetch('posts.json');
                if (!response.ok) throw new Error("JSON not found");
                
                allPosts = await response.json();
                allPosts.reverse(); // Latest on Top

                container.innerHTML = '';
                loadMorePosts();

            } catch (error) {
                container.innerHTML = `<p style="color: var(--primary); font-weight: 500;">Error: posts.json not found.</p>`;
            }
        }

        function loadMorePosts() {
            const container = document.getElementById('blogContainer');
            const seeMoreBtn = document.getElementById('seeMoreBtn');

            const start = visiblePostsCount;
            const end = visiblePostsCount + postsPerBatch;
            const postsToRender = allPosts.slice(start, end);

            postsToRender.forEach(post => {
                const card = `
                    <div class="blog-card" onclick="window.location.href='${post.link}'">
                        <img src="${post.image}" alt="${post.title}" class="blog-img">
                        <div class="blog-content">
                            <div class="blog-date">${post.date}</div>
                            <h3 class="blog-title">${post.title}</h3>
                            <p class="blog-desc">${post.excerpt}</p>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', card);
            });

            visiblePostsCount += postsToRender.length;

            if (visiblePostsCount >= allPosts.length) {
                seeMoreBtn.style.display = 'none';
            } else {
                seeMoreBtn.style.display = 'inline-block';
            }
        }

        document.addEventListener('DOMContentLoaded', initPosts);
    </script>
</body>
</html>
