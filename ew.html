<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Eid Mubarak 🌙</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel+Decorative:wght@400;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400&display=swap" rel="stylesheet"/>
<style>
  :root {
    --gold: #D4AF37;
    --gold-light: #F5E17A;
    --gold-dark: #9A7B1A;
    --emerald-dark: #020C07;
    --glass-bg: rgba(10, 30, 20, 0.4);
    --glass-border: rgba(212, 175, 55, 0.15);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow-x: hidden;
    background: var(--emerald-dark);
    font-family: 'Amiri', serif;
    cursor: none; /* Custom cursor */
  }

  /* === CUSTOM CURSOR === */
  .cursor {
    width: 12px; height: 12px;
    background: var(--gold-light);
    border-radius: 50%;
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    mix-blend-mode: screen;
    box-shadow: 0 0 15px var(--gold-light), 0 0 30px var(--gold);
    transition: transform 0.1s ease-out;
  }
  .cursor-trail {
    width: 36px; height: 36px;
    border: 1px solid rgba(212,175,55,0.5);
    border-radius: 50%;
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: transform 0.25s ease-out, opacity 0.3s;
  }

  /* === CANVAS === */
  #starCanvas, #fwCanvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  #fwCanvas { z-index: 4; }

  /* === PAGE WRAPPER === */
  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    overflow: hidden;
  }

  /* === RADIAL GLOW BG === */
  .page::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 50% 20%, rgba(10, 61, 46, 0.6) 0%, transparent 60%),
      radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 20% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
    z-index: -1;
    pointer-events: none;
  }

  /* === SMART GLASSMORPHISM FRAME === */
  .frame {
    position: relative;
    max-width: 700px;
    width: 100%;
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 60px 50px 40px;
    box-shadow: 
      0 30px 60px rgba(0,0,0,0.6), 
      inset 0 1px 0 rgba(255,255,255,0.1);
    text-align: center;
    animation: frameReveal 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes frameReveal {
    from { opacity: 0; transform: translateY(50px) scale(0.95); filter: blur(10px); }
    to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  /* === MOON === */
  .moon-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 25px;
    animation: moonFloat 6s ease-in-out infinite;
  }
  @keyframes moonFloat {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-10px); }
  }

  .moon {
    width: 80px; height: 80px;
    position: relative;
    filter: drop-shadow(0 0 25px rgba(212,175,55,0.5));
  }
  .moon svg { width: 100%; height: 100%; }

  /* === ARABIC TEXT === */
  .arabic {
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    color: var(--gold-light);
    margin-bottom: 10px;
    text-shadow: 0 0 30px rgba(245,225,122,0.3);
    animation: fadeSlide 1s 0.3s both;
  }

  /* === EID MUBARAK HEADING === */
  .eid-heading {
    font-family: 'Cinzel Decorative', cursive;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 700;
    background: linear-gradient(135deg, #FFF, #D4AF37, #F5E17A);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.05em;
    filter: drop-shadow(0 4px 15px rgba(212,175,55,0.2));
    margin-bottom: 10px;
    animation: fadeSlide 1s 0.5s both;
  }

  /* === DIVIDER === */
  .divider-line {
    display: flex;
    align-items: center;
    gap: 15px;
    margin: 20px auto 30px;
    max-width: 350px;
    animation: fadeSlide 1s 0.7s both;
  }
  .divider-line span {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(212,175,55,0.6), transparent);
  }
  .divider-line .star-icon {
    color: var(--gold);
    font-size: 0.9rem;
  }

  /* === DYNAMIC WISH BOX === */
  .wish-box {
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(212,175,55,0.1);
    border-radius: 12px;
    padding: 25px;
    margin: 0 auto 30px;
    max-width: 500px;
    animation: fadeSlide 1s 0.9s both;
    transition: all 0.3s ease;
  }
  
  .wish-to {
    font-family: 'Poppins', sans-serif;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: none; /* Hidden by default */
  }
  
  .wish-name {
    font-family: 'Cinzel Decorative', cursive;
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    color: var(--gold-light);
    margin-bottom: 15px;
    text-shadow: 0 0 20px rgba(212,175,55,0.4);
    display: none; /* Hidden by default */
  }
  
  .wish-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    color: rgba(255,255,255,0.85);
    line-height: 1.7;
    font-style: italic;
  }

  /* === LANTERNS === */
  .lanterns {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-bottom: 35px;
    animation: fadeSlide 1s 1.1s both;
  }
  .lantern {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    animation: lanternSwing 4s ease-in-out infinite;
    transform-origin: top center;
  }
  .lantern:nth-child(2) { animation-delay: -1s; }
  .lantern:nth-child(3) { animation-delay: -2s; }
  
  @keyframes lanternSwing {
    0%,100% { transform: rotate(-4deg); }
    50%     { transform: rotate(4deg); }
  }
  .lantern svg { width: 35px; height: 50px; }

  /* === FOOTER INFO === */
  .footer-text {
    font-family: 'Poppins', sans-serif;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 15px;
    animation: fadeSlide 1s 1.3s both;
  }

  .created-by {
    font-family: 'Poppins', sans-serif;
    font-size: 0.7rem;
    color: rgba(212,175,55,0.5);
    letter-spacing: 1px;
    margin-top: 20px;
    animation: fadeSlide 1s 1.5s both;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* === FLOATING PARTICLES & CONFETTI === */
  .particles-wrap, .confetti-wrap { 
    position: fixed; inset: 0; pointer-events: none; overflow: hidden; 
  }
  .particles-wrap { z-index: 2; }
  .confetti-wrap { z-index: 3; }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: var(--gold-light);
    opacity: 0;
    animation: particleFloat linear infinite;
  }
  @keyframes particleFloat {
    0%   { opacity: 0; transform: translateY(0) scale(0); }
    20%  { opacity: 0.6; }
    80%  { opacity: 0.3; }
    100% { opacity: 0; transform: translateY(-100vh) scale(1.5); }
  }

  .confetti-piece {
    position: absolute;
    opacity: 0;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { opacity: 1; transform: translateY(-50px) rotate(0deg); }
    100% { opacity: 0; transform: translateY(110vh) rotate(720deg); }
  }

  @media (max-width: 600px) {
    .frame { padding: 40px 20px; border-radius: 15px; }
    .wish-box { padding: 20px 15px; border-radius: 8px; }
  }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-trail" id="cursorTrail"></div>

<canvas id="starCanvas"></canvas>
<canvas id="fwCanvas"></canvas>
<div class="particles-wrap" id="particles"></div>
<div class="confetti-wrap" id="confetti"></div>

<div class="page">
  <div class="frame">
    <!-- MOON -->
    <div class="moon-wrap">
      <div class="moon">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="moonGrad" x1="20%" y1="0%" x2="80%" y2="100%">
              <stop offset="0%" stop-color="#FFF"/>
              <stop offset="50%" stop-color="#F5E17A"/>
              <stop offset="100%" stop-color="#D4AF37"/>
            </linearGradient>
          </defs>
          <path d="M55 10 C30 14 14 32 14 54 C14 75 30 90 55 90 C38 82 26 68 26 50 C26 33 38 18 55 10 Z" fill="url(#moonGrad)"/>
          <polygon points="78,20 80,26 87,26 81,30 83,37 78,33 73,37 75,30 69,26 76,26" fill="#F5E17A"/>
        </svg>
      </div>
    </div>

    <!-- ARABIC -->
    <div class="arabic">عيد الأضحى</div>

    <!-- MAIN HEADING -->
    <h1 class="eid-heading">Eid Mubarak</h1>

    <!-- DIVIDER -->
    <div class="divider-line">
      <span></span><span class="star-icon">✦</span><span></span>
    </div>

    <!-- DYNAMIC WISH BOX -->
    <div class="wish-box" id="wishBox">
      <div class="wish-to" id="wishTo">— Wishing You —</div>
      <div class="wish-name" id="wishName"></div>
      <div class="wish-text">
        May the divine blessings of Allah bring you hope, faith, and joy on Eid ul-Adha and forever. 
        May your sacrifices be appreciated and your prayers be answered. 🌙
      </div>
    </div>

    <!-- LANTERNS -->
    <div class="lanterns">
      <!-- Lantern 1 -->
      <div class="lantern">
        <svg viewBox="0 0 40 60" xmlns="http://www.w3.org/2000/svg">
          <line x1="20" y1="0" x2="20" y2="10" stroke="#D4AF37" stroke-width="1.5"/>
          <rect x="12" y="10" width="16" height="3" fill="#D4AF37"/>
          <path d="M12 13 L8 45 L32 45 L28 13 Z" fill="rgba(212,175,55,0.15)" stroke="#D4AF37" stroke-width="1"/>
          <rect x="8" y="45" width="24" height="4" fill="#D4AF37"/>
          <circle cx="20" cy="32" r="4" fill="#F5E17A" filter="drop-shadow(0 0 8px #F5E17A)"/>
        </svg>
      </div>
      <!-- Lantern 2 -->
      <div class="lantern">
        <svg viewBox="0 0 40 60" xmlns="http://www.w3.org/2000/svg">
          <line x1="20" y1="0" x2="20" y2="10" stroke="#D4AF37" stroke-width="1.5"/>
          <rect x="12" y="10" width="16" height="3" fill="#D4AF37"/>
          <path d="M12 13 L8 45 L32 45 L28 13 Z" fill="rgba(212,175,55,0.15)" stroke="#D4AF37" stroke-width="1"/>
          <rect x="8" y="45" width="24" height="4" fill="#D4AF37"/>
          <circle cx="20" cy="32" r="4" fill="#F5E17A" filter="drop-shadow(0 0 8px #F5E17A)"/>
        </svg>
      </div>
    </div>

    <!-- FOOTER INFO -->
    <div class="footer-text">✦ Eid ul-Adha ✦ 1447 Hijri ✦</div>
    
    <!-- CREATOR CREDIT -->
    <div class="created-by">Created by Salim</div>
  </div>
</div>

<script>
/* === URL PARAMETER LOGIC (`?s=Name`) === */
document.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);
  let name = params.get('s');
  const wishNameEl = document.getElementById('wishName');
  const wishToEl = document.getElementById('wishTo');

  if (name && name.trim() !== '') {
    // Format name (replace underscore with space, capitalize first letters)
    name = name.replace(/_/g, ' ');
    name = name.replace(/\b\w/g, c => c.toUpperCase());
    
    wishNameEl.textContent = name;
    wishNameEl.style.display = 'block';
    wishToEl.style.display = 'block';
  }
  // If no name is provided, the name elements remain hidden, 
  // and only the general wish message is shown naturally within the box.
});

/* === CUSTOM CURSOR === */
const cursor = document.getElementById('cursor');
const trail  = document.getElementById('cursorTrail');
let mx = window.innerWidth/2, my = window.innerHeight/2, tx = mx, ty = my;

document.addEventListener('mousemove', e => { 
  mx = e.clientX; 
  my = e.clientY; 
  cursor.style.left = mx + 'px';
  cursor.style.top  = my + 'px';
});

(function animCursor() {
  tx += (mx - tx) * 0.15;
  ty += (my - ty) * 0.15;
  trail.style.left  = tx + 'px';
  trail.style.top   = ty + 'px';
  requestAnimationFrame(animCursor);
})();

/* === STAR CANVAS === */
const sc = document.getElementById('starCanvas');
const sctx = sc.getContext('2d');
let stars = [];
function resizeStar() { sc.width = window.innerWidth; sc.height = window.innerHeight; }
window.addEventListener('resize', resizeStar);
resizeStar();

for (let i = 0; i < 150; i++) {
  stars.push({
    x: Math.random() * sc.width, y: Math.random() * sc.height,
    r: Math.random() * 1.2, speed: Math.random() * 0.02, phase: Math.random() * Math.PI * 2
  });
}

function drawStars() {
  sctx.clearRect(0, 0, sc.width, sc.height);
  const t = Date.now() * 0.001;
  sctx.fillStyle = '#FFF';
  stars.forEach(s => {
    sctx.globalAlpha = 0.3 + 0.7 * Math.sin(t * s.speed * 50 + s.phase);
    sctx.beginPath();
    sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    sctx.fill();
  });
  requestAnimationFrame(drawStars);
}
drawStars();

/* === FLOATING PARTICLES === */
const particlesWrap = document.getElementById('particles');
for (let i = 0; i < 20; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  const size = Math.random() * 4 + 2;
  p.style.cssText = `
    width:${size}px; height:${size}px;
    left:${Math.random()*100}%;
    top:${Math.random()*20 + 100}%;
    animation-duration:${Math.random()*10+10}s;
    animation-delay:${Math.random()*5}s;
    box-shadow: 0 0 ${size*2}px #D4AF37;
  `;
  particlesWrap.appendChild(p);
}

/* === FIREWORKS === */
const fw = document.getElementById('fwCanvas');
const fctx = fw.getContext('2d');
window.addEventListener('resize', () => { fw.width=window.innerWidth; fw.height=window.innerHeight; });
fw.width = window.innerWidth; fw.height = window.innerHeight;

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y; this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 1;
    this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
    this.life = 1; this.decay = Math.random() * 0.015 + 0.015;
    this.size = Math.random() * 2.5 + 1;
  }
  update() {
    this.x += this.vx; this.y += this.vy; this.vy += 0.05;
    this.life -= this.decay; this.size *= 0.96;
  }
  draw(ctx) {
    ctx.globalAlpha = this.life; ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
  }
}

let fwParticles = [];
const fwColors = ['#D4AF37','#F5E17A','#FFFFFF','#0F5C44'];

function launchFirework() {
  const x = Math.random() * fw.width;
  const y = Math.random() * fw.height * 0.6 + 20;
  const color = fwColors[Math.floor(Math.random()*fwColors.length)];
  for (let i = 0; i < 60; i++) fwParticles.push(new Particle(x, y, color));
}

function animFireworks() {
  fctx.clearRect(0, 0, fw.width, fw.height);
  fwParticles = fwParticles.filter(p => p.life > 0);
  fwParticles.forEach(p => { p.update(); p.draw(fctx); });
  requestAnimationFrame(animFireworks);
}
animFireworks();

setTimeout(launchFirework, 500);
setTimeout(launchFirework, 1500);
setInterval(() => { if (Math.random() > 0.6) launchFirework(); }, 3000);

</script>
</body>
</html>
