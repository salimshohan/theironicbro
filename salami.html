<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salami Adhikar!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden; /* Prevents scrollbars when button jumps */
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            z-index: 10;
        }
        h1 { color: #2c3e50; }
        p { color: #555; font-size: 18px; margin-bottom: 30px; }
        
        .btn-container {
            position: relative;
            height: 60px; /* Space for buttons */
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #yes-btn {
            background-color: #27ae60;
            color: white;
            margin-right: 15px;
        }
        #yes-btn:hover { transform: scale(1.05); }
        
        #no-btn {
            background-color: #e74c3c;
            color: white;
            position: absolute; /* Needed for the jumping effect */
        }

        /* Modal Styles */
        #modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            z-index: 100;
            text-align: center;
            width: 80%;
            max-width: 400px;
        }
        #modal h2 { color: #27ae60; }
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 50;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Eid Mubarak Boro Bhai! 🌙</h1>
        <p>Salami chara ei page theke ber howa nishedh. Apnar digital wallet scan kora hoyeche, ebar apnar kache onek taka!</p>
        
        <div class="btn-container">
            <button id="yes-btn">Salami Dibo! (Udar Mon)</button>
            <button id="no-btn">Dibo na (Kipta)</button>
        </div>
    </div>

    <div id="overlay"></div>
    <div id="modal">
        <h2>Alhamdulillah! 🎉</h2>
        <p>Rajshahi University er sobcheye boro lok bhai peye gechi!</p>
        <p><strong>bKash/Nagad Number:</strong> 01XXXXXXXXX</p>
        <br>
        <button onclick="closeModal()" style="background: #3498db; color: white; margin-top: 15px;">Close</button>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const modal = document.getElementById('modal');
        const overlay = document.getElementById('overlay');

        // Make the "No" button run away on hover
        noBtn.addEventListener('mouseover', () => {
            // Calculate random positions within the visible window
            const x = Math.random() * (window.innerWidth - noBtn.clientWidth - 20);
            const y = Math.random() * (window.innerHeight - noBtn.clientHeight - 20);
            
            noBtn.style.position = 'fixed'; // Changes to fixed so it moves relative to screen
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        });

        // Show popup when "Yes" is clicked
        yesBtn.addEventListener('click', () => {
            modal.style.display = 'block';
            overlay.style.display = 'block';
        });

        // Close modal function
        function closeModal() {
            modal.style.display = 'none';
            overlay.style.display = 'none';
        }
    </script>
</body>
</html>
