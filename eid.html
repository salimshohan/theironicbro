<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid Mubarak Celebration</title>
    
    <!-- Google Fonts for Premium Look -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #1b263b 0%, #0d1b2a 100%);
            color: #e0e1dd;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        /* Glassmorphism Premium Container */
        .card-container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            padding: 50px 60px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            animation: popIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: scale(0.9);
            max-width: 600px;
            width: 90%;
        }

        /* Glowing Gold Text */
        h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(3rem, 8vw, 4.5rem);
            color: #d4af37; /* Metallic Gold */
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5), 0 0 30px rgba(212, 175, 55, 0.3);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .name-highlight {
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            font-weight: 600;
            color: #ffffff;
            margin-top: 15px;
            text-transform: capitalize;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
            display: none; /* Hidden by default, shown via JS if name exists */
            animation: fadeIn 2s ease-in-out 1s forwards;
            opacity: 0;
        }

        .message {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-top: 25px;
            color: #a9b0c0;
            font-weight: 300;
            animation: fadeIn 2s ease-in-out 1.5s forwards;
            opacity: 0;
        }

        /* Decorative Elements */
        .moon-icon {
            font-size: 3rem;
            color: #d4af37;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
            animation: float 4s ease-in-out infinite;
        }

        /* Animations */
        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <!-- Confetti Library via CDN for premium celebration effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <div class="card-container">
        <div class="moon-icon">🌙</div>
        <h1>Eid Mubarak</h1>
        <div id="dynamicName" class="name-highlight"></div>
        <p class="message">May the divine blessings of Allah bring you peace, happiness, and prosperity on this auspicious occasion. Wishing you a joyous Eid-Ul-Fitr!</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // ১. URL থেকে প্যারামিটার কালেক্ট করা
            const urlParams = new URLSearchParams(window.location.search);
            const rawName = urlParams.get('name');
            const nameElement = document.getElementById('dynamicName');

            // ২. নাম থাকলে সেটা প্রসেস করে দেখানো
            if (rawName) {
                // আন্ডারস্কোর (_) কে স্পেস দিয়ে রিপ্লেস করা
                const formattedName = rawName.replace(/_/g, ' ');
                nameElement.textContent = "Dear " + formattedName + ",";
                nameElement.style.display = "block";
            }

            // ৩. সেলিব্রেশন কনফেটি (Confetti) ফায়ারওয়ার্কস অ্যানিমেশন
            const duration = 4 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 60 * (timeLeft / duration);
                
                // Left Side Confetti
                confetti(Object.assign({}, defaults, { 
                    particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                    colors: ['#d4af37', '#ffffff', '#1b263b']
                }));
                
                // Right Side Confetti
                confetti(Object.assign({}, defaults, { 
                    particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                    colors: ['#d4af37', '#ffffff', '#1b263b']
                }));
            }, 250);
        });
    </script>
</body>
</html>
