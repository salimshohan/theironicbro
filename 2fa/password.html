<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Password Generator | The Ironic Bro</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        /* --- Global Styles (TIB Smart Light Mode) --- */
        :root {
            --bg-body: #f8fafc;       
            --bg-card: #ffffff;       
            --primary: #4f46e5;       
            --primary-hover: #4338ca; 
            --text-main: #0f172a;     
            --text-muted: #64748b;    
            --border: #e2e8f0;        
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body { 
            background-color: var(--bg-body); 
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main); 
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

        /* --- Main Content --- */
        .container { 
            margin-top: 80px; 
            width: 100%; max-width: 600px; 
            padding: 0 20px; 
            flex: 1; 
            margin-bottom: 50px;
        }
        
        .section-title { 
            font-size: 2rem; 
            margin-bottom: 30px; 
            border-left: 5px solid var(--primary); 
            padding-left: 15px; 
            font-weight: 700; 
            color: var(--text-main);
        }

        /* --- Tool Card --- */
        .tool-card {
            background: var(--bg-card); 
            border: 1px solid var(--border);
            border-radius: 16px; 
            padding: 30px;
            box-shadow: var(--shadow-md);
        }

        /* --- Result Area --- */
        .result-box {
            background: var(--bg-body);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .code-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .password-display { 
            font-size: 1.8rem; font-weight: 700; color: var(--text-main); 
            letter-spacing: 2px; font-family: monospace; word-break: break-all;
            margin-right: 15px;
        }
        
        .btn-copy { 
            background: var(--bg-card); border: 1px solid var(--border); 
            color: var(--text-main); width: 45px; height: 45px; 
            border-radius: 10px; cursor: pointer; font-size: 1.2rem; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm);
            flex-shrink: 0;
        }
        .btn-copy:hover { border-color: var(--primary); color: var(--primary); transform: scale(1.05); }

        /* Strength Meter */
        .strength-info { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .progress-container { width: 100%; height: 8px; background: var(--border); border-radius: 10px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; transition: width 0.4s ease, background 0.4s ease; }

        /* --- Settings Area --- */
        .settings-group { margin-bottom: 20px; }
        
        /* Length Slider */
        .length-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: 600; }
        .length-val { background: var(--primary); color: white; padding: 4px 12px; border-radius: 8px; font-size: 0.9rem; }
        
        input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 6px; background: var(--border); border-radius: 5px; outline: none; margin-bottom: 25px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); cursor: pointer; transition: 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        /* Checkboxes */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .checkbox-item {
            display: flex; align-items: center; cursor: pointer; font-size: 0.95rem; font-weight: 500; color: var(--text-main);
            background: var(--bg-body); padding: 12px 15px; border-radius: 10px; border: 1px solid var(--border); transition: 0.2s;
        }
        .checkbox-item:hover { border-color: var(--primary); }
        .checkbox-item input { margin-right: 10px; width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }

        /* --- Action Button --- */
        .btn-generate {
            width: 100%; padding: 14px; border: none; border-radius: 10px;
            font-size: 1.1rem; font-weight: 600; cursor: pointer; 
            transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 10px;
            background: var(--primary); color: white; box-shadow: var(--shadow-sm);
        }
        .btn-generate:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: var(--shadow-md); }

        /* --- Toast Notification --- */
        .toast {
            position: fixed; bottom: -60px; left: 50%; transform: translateX(-50%);
            background: var(--text-main); color: #fff; padding: 12px 25px;
            border-radius: 50px; font-size: 0.9rem; font-weight: 500;
            box-shadow: var(--shadow-lg); transition: bottom 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000; display: flex; align-items: center; gap: 10px;
        }
        .toast.show { bottom: 30px; }

        /* --- Footer --- */
        footer {
            width: 100%; padding: 25px 15px; text-align: center; background: #ffffff;
            border-top: 1px solid var(--border); margin-top: auto; font-size: 14px; color: var(--text-muted);
        }
        .footer-content strong { color: var(--text-main); }
        
        @media (max-width: 480px) {
            .options-grid { grid-template-columns: 1fr; }
            .password-display { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div id="header"></div>
    <script type="text/javascript" src="/js/header.js"></script>

    <div class="container">
        <div class="section-title">Password Generator</div>

        <div class="tool-card">
            <div class="result-box">
                <div class="code-row">
                    <div class="password-display" id="passwordDisplay">Click Generate</div>
                    <button class="btn-copy" onclick="copyPassword()" title="Copy Password">
                        <i class="fa-solid fa-copy"></i>
                    </button>
                </div>
                
                <div class="strength-info">
                    <span style="color: var(--text-muted);">Strength</span>
                    <span id="strengthText" style="color: var(--success);">Strong</span>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="strengthBar"></div>
                </div>
            </div>

            <div class="settings-group">
                <div class="length-header">
                    <span>Password Length</span>
                    <span class="length-val" id="lengthDisplay">16</span>
                </div>
                <input type="range" id="lengthSlider" min="6" max="64" value="16" oninput="updateLengthDisplay()">

                <div class="options-grid">
                    <label class="checkbox-item">
                        <input type="checkbox" id="chkUpper" checked onchange="saveSettings()"> Uppercase (A-Z)
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="chkLower" checked onchange="saveSettings()"> Lowercase (a-z)
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="chkNumber" checked onchange="saveSettings()"> Numbers (0-9)
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="chkSymbol" checked onchange="saveSettings()"> Symbols (!@#$)
                    </label>
                </div>
            </div>

            <button class="btn-generate" onclick="generatePassword()">
                <i class="fa-solid fa-bolt"></i> Generate Password
            </button>
        </div>
    </div>

    <div class="toast" id="toastMsg"><i class="fa-solid fa-circle-check" style="color: var(--success);"></i> <span>Copied to clipboard!</span></div>

    <footer>
        <div class="footer-content">
            &copy; 2026 <strong>The Ironic Bro</strong><br>All rights reserved.
        </div>
    </footer>

    <script>
        // Character Sets
        const chars = {
            upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
            lower: "abcdefghijklmnopqrstuvwxyz",
            number: "0123456789",
            symbol: "!@#$%^&*()_+~|}{[]:;?><,./-="
        };

        const STORAGE_KEY = 'tib_pass_gen_settings';

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            generatePassword();
        });

        // Update Slider Display
        function updateLengthDisplay() {
            const length = document.getElementById('lengthSlider').value;
            document.getElementById('lengthDisplay').innerText = length;
            saveSettings();
        }

        // Generate Password Logic
        function generatePassword() {
            const length = document.getElementById('lengthSlider').value;
            const hasUpper = document.getElementById('chkUpper').checked;
            const hasLower = document.getElementById('chkLower').checked;
            const hasNumber = document.getElementById('chkNumber').checked;
            const hasSymbol = document.getElementById('chkSymbol').checked;

            let allowedChars = "";
            let newPassword = "";

            if (hasUpper) allowedChars += chars.upper;
            if (hasLower) allowedChars += chars.lower;
            if (hasNumber) allowedChars += chars.number;
            if (hasSymbol) allowedChars += chars.symbol;

            // Error handle if nothing is selected
            if (allowedChars === "") {
                showToast("Please select at least one option!", true);
                document.getElementById('chkLower').checked = true; // Force check lowercase
                saveSettings();
                allowedChars += chars.lower;
            }

            // Random generation
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * allowedChars.length);
                newPassword += allowedChars[randomIndex];
            }

            document.getElementById('passwordDisplay').innerText = newPassword;
            updateStrengthMeter(length, hasUpper, hasLower, hasNumber, hasSymbol);
        }

        // Strength Calculation
        function updateStrengthMeter(length, upper, lower, number, symbol) {
            let score = 0;
            if (length > 8) score++;
            if (length >= 12) score++;
            if (length >= 16) score++;
            if (upper && lower) score++;
            if (number) score++;
            if (symbol) score++;

            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');

            if (score <= 2) {
                bar.style.width = '30%'; bar.style.background = 'var(--danger)';
                text.innerText = 'Weak'; text.style.color = 'var(--danger)';
            } else if (score <= 4) {
                bar.style.width = '60%'; bar.style.background = 'var(--warning)';
                text.innerText = 'Medium'; text.style.color = 'var(--warning)';
            } else {
                bar.style.width = '100%'; bar.style.background = 'var(--success)';
                text.innerText = 'Strong'; text.style.color = 'var(--success)';
            }
        }

        // Save preferences to Local Storage
        function saveSettings() {
            const settings = {
                length: document.getElementById('lengthSlider').value,
                upper: document.getElementById('chkUpper').checked,
                lower: document.getElementById('chkLower').checked,
                number: document.getElementById('chkNumber').checked,
                symbol: document.getElementById('chkSymbol').checked
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        }

        // Load preferences from Local Storage
        function loadSettings() {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                const settings = JSON.parse(savedData);
                document.getElementById('lengthSlider').value = settings.length;
                document.getElementById('lengthDisplay').innerText = settings.length;
                document.getElementById('chkUpper').checked = settings.upper;
                document.getElementById('chkLower').checked = settings.lower;
                document.getElementById('chkNumber').checked = settings.number;
                document.getElementById('chkSymbol').checked = settings.symbol;
            }
        }

        // Copy Function with Toast
        function copyPassword() {
            const pwd = document.getElementById('passwordDisplay').innerText;
            if(pwd === "Click Generate" || pwd === "") return;

            navigator.clipboard.writeText(pwd).then(() => {
                showToast("Password copied!");
            });
        }

        // Custom Toast Notification Logic
        function showToast(message, isError = false) {
            const toast = document.getElementById('toastMsg');
            const icon = isError ? '<i class="fa-solid fa-circle-exclamation" style="color: var(--danger);"></i>' : '<i class="fa-solid fa-circle-check" style="color: var(--success);"></i>';
            
            toast.innerHTML = `${icon} <span>${message}</span>`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
