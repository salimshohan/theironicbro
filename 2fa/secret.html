<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart 2FA Authenticator</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.2.2/otpauth.umd.min.js"></script>

    <style>
        /* Base Styles & Smart UI Dark Theme */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Header */
        header { background: #1e293b; padding: 20px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        header h1 { font-size: 24px; font-weight: 600; color: #38bdf8; }
        header h1 i { margin-right: 10px; }

        /* Main Body/Container */
        main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #1e293b; width: 100%; max-width: 450px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        
        /* Input & Buttons */
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; }
        input[type="text"] { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; outline: none; transition: 0.3s; }
        input[type="text"]:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
        
        .action-btns { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-generate { background: #38bdf8; color: #0f172a; }
        .btn-generate:hover { background: #0284c7; color: white; }
        .btn-reset { background: #ef4444; color: white; }
        .btn-reset:hover { background: #b91c1c; }

        /* Result Area */
        .result-section { margin-top: 30px; display: none; background: #0f172a; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
        .code-container { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 15px; }
        .code-display { font-size: 40px; font-weight: 600; letter-spacing: 6px; color: #10b981; }
        .btn-copy { background: #334155; color: white; border-radius: 8px; padding: 10px 15px; flex: none; width: auto; font-size: 18px; }
        .btn-copy:hover { background: #475569; color: #38bdf8; }

        /* Timer UI */
        .timer-info { font-size: 14px; color: #94a3b8; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .progress-bar-container { width: 100%; height: 6px; background: #334155; border-radius: 10px; overflow: hidden; }
        .progress-bar { height: 100%; background: #10b981; width: 100%; transition: width 1s linear, background 0.3s; }
        .progress-bar.warning { background: #ef4444; } /* Red when time is low */

        /* Footer */
        footer { background: #1e293b; padding: 15px; text-align: center; font-size: 14px; color: #64748b; border-top: 1px solid #334155; }
        footer a { color: #38bdf8; text-decoration: none; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-shield-halved"></i> Smart 2FA Authenticator</h1>
    </header>

    <main>
        <div class="card">
            <div class="input-group">
                <label for="secret"><i class="fa-solid fa-key"></i> Enter Secret Key</label>
                <input type="text" id="secret" placeholder="e.g. JBSWY3DPEHPK3PXP" autocomplete="off">
            </div>
            
            <div class="action-btns">
                <button class="btn-generate" onclick="startApp()"><i class="fa-solid fa-bolt"></i> Generate</button>
                <button class="btn-reset" onclick="resetApp()"><i class="fa-solid fa-rotate-right"></i> Reset</button>
            </div>

            <div class="result-section" id="resultSection">
                <div class="code-container">
                    <div class="code-display" id="codeDisplay">000000</div>
                    <button class="btn-copy" onclick="copyCode()" title="Copy to clipboard">
                        <i class="fa-solid fa-copy" id="copyIcon"></i>
                    </button>
                </div>
                
                <div class="timer-info">
                    <span>Valid for:</span>
                    <span id="countdownText">30s</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>Built with <i class="fa-solid fa-heart" style="color: #ef4444;"></i> Smart UI. Runs 100% locally in your browser.</p>
    </footer>

    <script>
        let timerInterval;
        let currentSecret = '';

        // App Start korar function
        function startApp() {
            currentSecret = document.getElementById('secret').value.replace(/\s+/g, '').toUpperCase();
            
            if(!currentSecret) {
                alert("Please enter a valid Secret Key!");
                return;
            }

            // Output section visible kora
            document.getElementById('resultSection').style.display = 'block';
            
            // Prothom bar sathe sathe update kora
            updateCodeAndTimer();
            
            // Agere kono interval thakle clear kore notun kore start kora (Proti 1 second e update hobe)
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateCodeAndTimer, 1000);
        }

        // Code generate ebong timer update korar main logic
        function updateCodeAndTimer() {
            try {
                // Generate TOTP
                let totp = new OTPAuth.TOTP({
                    algorithm: 'SHA1',
                    digits: 6,
                    period: 30,
                    secret: OTPAuth.Secret.fromBase32(currentSecret)
                });
                
                document.getElementById('codeDisplay').innerText = totp.generate();
                
                // Timer Calculation (Current UNIX time theke ber kora hocche)
                let epoch = Math.floor(Date.now() / 1000);
                let remainingTime = 30 - (epoch % 30);
                
                // UI Update (Text & Progress Bar)
                document.getElementById('countdownText').innerText = remainingTime + "s";
                
                let progressBar = document.getElementById('progressBar');
                let percentage = (remainingTime / 30) * 100;
                progressBar.style.width = percentage + "%";

                // Somoy kom thakle color red hobe (warning)
                if (remainingTime <= 5) {
                    progressBar.classList.add('warning');
                    document.getElementById('codeDisplay').style.color = '#ef4444';
                } else {
                    progressBar.classList.remove('warning');
                    document.getElementById('codeDisplay').style.color = '#10b981';
                }

            } catch (error) {
                clearInterval(timerInterval);
                document.getElementById('resultSection').style.display = 'none';
                alert("Invalid Secret Key format. Please check again.");
            }
        }

        // Code Copy korar function
        function copyCode() {
            let code = document.getElementById('codeDisplay').innerText;
            navigator.clipboard.writeText(code).then(() => {
                // Copy icon change kore checkmark dekhano
                let icon = document.getElementById('copyIcon');
                icon.className = "fa-solid fa-check";
                icon.style.color = "#10b981";
                
                // 2 second por abar ager icon e back kora
                setTimeout(() => {
                    icon.className = "fa-solid fa-copy";
                    icon.style.color = "";
                }, 2000);
            });
        }

        // Sob clear korar function
        function resetApp() {
            clearInterval(timerInterval);
            document.getElementById('secret').value = '';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('codeDisplay').innerText = '000000';
        }
    </script>

</body>
</html>
