<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA Code Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.2.2/otpauth.umd.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        input {
            width: 80%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .code-display {
            font-size: 40px;
            font-weight: bold;
            letter-spacing: 5px;
            margin-top: 20px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>2FA Code Generator</h2>
        <input type="text" id="secretKey" placeholder="Enter your Secret Key here">
        <br>
        <button onclick="generateOTP()">Get 6-Digit Code</button>
        
        <div class="code-display" id="output">------</div>
    </div>

    <script>
        function generateOTP() {
            // User er deya input theke space remove kore uppercase kora hocche
            let secret = document.getElementById('secretKey').value.replace(/\s+/g, '').toUpperCase();
            
            if(!secret) {
                alert("Please enter a secret key!");
                return;
            }

            try {
                // OTPAuth library babohar kore TOTP object toiri
                let totp = new OTPAuth.TOTP({
                    algorithm: 'SHA1',
                    digits: 6,
                    period: 30, // Code ta 30 second por por change hobe
                    secret: OTPAuth.Secret.fromBase32(secret)
                });

                // 6-digit code generate kora
                let token = totp.generate();
                document.getElementById('output').innerText = token;
                
            } catch (error) {
                alert("Invalid Secret Key! Please check again.");
                document.getElementById('output').innerText = "------";
            }
        }
    </script>

</body>
</html>
