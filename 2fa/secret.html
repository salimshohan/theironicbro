<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart 2FA Pro | The Ironic Bro</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.2.2/otpauth.umd.min.js"></script>

    <style>
        /* --- Global Styles (TIB Smart Light Mode) --- */
        :root {
            --bg-body: #f8fafc;       
            --bg-card: #ffffff;       
            --primary: #4f46e5;       
            --primary-hover: #4338ca; 
            --text-main: #0f172a;     
            --text-muted: #64748b;    
            --border: #e2e8f0;        
            --success: #10b981;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body { 
            background-color: var(--bg-body); 
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main); 
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            
            /* Anti-Copy for entire page */
            -webkit-user-select: none; 
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

        .container { 
            margin-top: 60px; width: 100%; max-width: 600px; 
            padding: 0 20px; flex: 1; margin-bottom: 50px;
        }
        
        /* Fixed h2 Heading */
        h2.section-title { 
            font-size: 2rem; margin-bottom: 25px; 
            border-left: 5px solid var(--primary); padding-left: 15px; 
            font-weight: 700; color: var(--text-main);
            display: flex; align-items: center; gap: 10px;
        }

        /* --- Smart Input Area --- */
        .add-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; padding: 30px; box-shadow: var(--shadow-md);
            margin-bottom: 30px;
        }

        .input-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
        }

        /* Smart Floating Label Inputs */
        .floating-input { position: relative; margin-bottom: 20px; }
        .floating-input input {
            width: 100%; padding: 18px 15px 12px;
            border: 2px solid var(--border); border-radius: 10px;
            background: transparent; font-size: 1rem; color: var(--text-main);
            transition: all 0.3s ease; font-family: monospace; letter-spacing: 1px;
            /* Allow text typing but cursor selection is standard */
        }
        .floating-input label {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 0.95rem; transition: all 0.3s ease;
            pointer-events: none; background: var(--bg-card); padding: 0 5px;
        }
        .floating-input input:focus, .floating-input input:not(:placeholder-shown) {
            border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }
        .floating-input input:focus ~ label, .floating-input input:not(:placeholder-shown) ~ label {
            top: 0; font-size: 0.85rem; color: var(--primary); font-weight: 700;
        }

        .btn-add {
            width: 100%; padding: 15px; border: none; border-radius: 10px;
            font-size: 1.1rem; font-weight: 600; cursor: pointer; 
            transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 10px;
            background: var(--primary); color: white; box-shadow: var(--shadow-sm);
        }
        .btn-add:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .btn-add:disabled { background: var(--text-muted); cursor: not-allowed; transform: none; }

        /* --- Global Timer --- */
        .global-timer {
            display: none; background: var(--bg-card); padding: 15px 20px; border-radius: 12px;
            border: 1px solid var(--border); margin-bottom: 20px; box-shadow: var(--shadow-sm);
        }
        .timer-header { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        .progress-container { width: 100%; height: 6px; background: var(--border); border-radius: 10px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--success); width: 100%; transition: width 1s linear, background 0.3s; }
        .progress-bar.danger { background: var(--danger); }

        /* --- Accounts List --- */
        .accounts-grid { display: flex; flex-direction: column; gap: 15px; }
        .acc-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; position: relative;
            box-shadow: var(--shadow-sm); transition: 0.3s; display: flex; flex-direction: column;
        }
        .acc-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); }
        
        .acc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); }
        
        .acc-info { display: flex; flex-direction: column; }
        .acc-brand { font-weight: 700; color: var(--text-main); font-size: 1.1rem; }
        .acc-user { font-size: 0.85rem; color: var(--text-muted); margin-top: 3px; font-weight: 500; }
        
        .btn-del-single { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; transition: 0.2s; padding: 5px; }
        .btn-del-single:hover { color: var(--danger); transform: scale(1.1); }

        .codes-wrapper { display: flex; justify-content: space-between; align-items: center; }
        
        /* Allow selecting ONLY the codes */
        .current-code, .next-code {
            -webkit-user-select: text; 
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text; 
        }

        .current-code { font-size: 2.2rem; font-weight: 700; color: var(--primary); letter-spacing: 2px; font-family: monospace; cursor: pointer; transition: 0.2s; }
        .current-code:hover { opacity: 0.8; }
        
        .next-code-box { text-align: right; }
        .next-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .next-code { font-size: 1.1rem; color: var(--text-muted); font-family: monospace; cursor: pointer; }
        .next-code:hover { color: var(--primary); }

        /* --- Sticky Reset Button (Bottom RIGHT) --- */
        .sticky-reset {
            position: fixed; bottom: 30px; right: 30px; /* Moved to Right */
            width: 50px; height: 50px;
            background: var(--bg-card); color: var(--danger);
            border: 2px solid #fee2e2; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; cursor: pointer; z-index: 1000;
            box-shadow: var(--shadow-lg); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sticky-reset:hover {
            background: #fee2e2; transform: translateY(-5px) scale(1.05);
        }

        /* --- Toast Notification --- */
        .toast {
            position: fixed; bottom: -60px; left: 50%; transform: translateX(-50%);
            background: var(--text-main); color: #fff; padding: 12px 25px;
            border-radius: 50px; font-size: 0.9rem; font-weight: 500;
            box-shadow: var(--shadow-lg); transition: bottom 0.4s ease;
            z-index: 1000; display: flex; align-items: center; gap: 10px;
        }
        .toast.show { bottom: 30px; }
        
        .counter-text { font-size: 0.85rem; color: var(--text-muted); text-align: right; margin-top: 10px; font-weight: 600;}
        
        @media (max-width: 480px) {
            .input-row { grid-template-columns: 1fr; gap: 0; }
        }

    </style>
</head>
<body>

    <div id="header"></div>
    <script type="text/javascript" src="/js/header.js"></script>

    <div class="container">
        <h2 class="section-title"><i class="fa-solid fa-shield-halved"></i> 2FA Authenticator</h2>

        <div class="add-card">
            
            <div class="input-row">
                <div class="floating-input">
                    <input type="text" id="brandInput" placeholder=" " maxlength="20" autocomplete="off">
                    <label><i class="fa-solid fa-tag"></i> Brand (e.g. GitHub)</label>
                </div>
                
                <div class="floating-input">
                    <input type="text" id="userInput" placeholder=" " maxlength="40" autocomplete="off">
                    <label><i class="fa-solid fa-user"></i> Username (Optional)</label>
                </div>
            </div>
            
            <div class="floating-input">
                <input type="text" id="secretKeyInput" placeholder=" " autocomplete="off">
                <label><i class="fa-solid fa-key"></i> Secret Key (Base32)</label>
            </div>

            <button class="btn-add" id="addBtn" onclick="addAccount()">
                <i class="fa-solid fa-plus-circle"></i> Add Authenticator
            </button>
            <div class="counter-text" id="slotCounter">Slots available: 50/50</div>
        </div>

        <div class="global-timer" id="globalTimer">
            <div class="timer-header">
                <span>Codes valid for:</span>
                <span id="countdownText">30s</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <div class="accounts-grid" id="accountsContainer">
            </div>
    </div>

    <button class="sticky-reset" onclick="resetAllAccounts()" title="Delete All Accounts">
        <i class="fa-solid fa-trash-can"></i>
    </button>

    <div class="toast" id="toastMsg"><i class="fa-solid fa-circle-check"></i> <span>Message</span></div>

    <script>
        const STORAGE_KEY = 'tib_2fa_multi_secrets';
        const MAX_SLOTS = 50; // Updated limit to 50
        let accounts = []; 
        let timerInterval;

        document.addEventListener('DOMContentLoaded', () => {
            loadAccounts();
        });

        // Add New Account Logic
        function addAccount() {
            if (accounts.length >= MAX_SLOTS) {
                showToast(`Maximum ${MAX_SLOTS} accounts allowed!`, true);
                return;
            }

            const brandValue = document.getElementById('brandInput').value.trim() || 'Unknown Service';
            const userValue = document.getElementById('userInput').value.trim();
            const rawSecret = document.getElementById('secretKeyInput').value;
            const cleanSecret = rawSecret.replace(/\s+/g, '').toUpperCase();

            if (!cleanSecret) {
                showToast("Secret Key cannot be empty!", true);
                return;
            }

            try {
                new OTPAuth.TOTP({ secret: OTPAuth.Secret.fromBase32(cleanSecret) });
            } catch (error) {
                showToast("Invalid Secret Key format!", true);
                return;
            }

            accounts.push({ brand: brandValue, username: userValue, secret: cleanSecret });
            saveAccounts();
            
            // Clear inputs
            document.getElementById('brandInput').value = '';
            document.getElementById('userInput').value = '';
            document.getElementById('secretKeyInput').value = '';
            
            showToast(`Added ${brandValue} successfully!`);
            renderAccounts();
        }

        // Render UI Cards
        function renderAccounts() {
            const container = document.getElementById('accountsContainer');
            const timerBox = document.getElementById('globalTimer');
            const counter = document.getElementById('slotCounter');
            const addBtn = document.getElementById('addBtn');
            
            container.innerHTML = ''; 

            if (accounts.length === 0) {
                timerBox.style.display = 'none';
                if(timerInterval) clearInterval(timerInterval);
            } else {
                timerBox.style.display = 'block';
                
                accounts.forEach((acc, index) => {
                    // Only show username div if user entered one
                    const userHtml = acc.username ? `<div class="acc-user"><i class="fa-regular fa-circle-user"></i> ${acc.username}</div>` : '';
                    
                    const card = `
                        <div class="acc-card">
                            <div class="acc-header">
                                <div class="acc-info">
                                    <div class="acc-brand">${acc.brand}</div>
                                    ${userHtml}
                                </div>
                                <button class="btn-del-single" onclick="deleteAccount(${index})" title="Remove"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                            <div class="codes-wrapper">
                                <div class="current-code" id="curr-${index}" onclick="copyCode('curr-${index}')" title="Copy Current">------</div>
                                <div class="next-code-box">
                                    <div class="next-label">Next Code</div>
                                    <div class="next-code" id="next-${index}" onclick="copyCode('next-${index}')" title="Copy Next">------</div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', card);
                });

                updateAllCodes();
                if(timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(updateAllCodes, 1000);
            }

            // Update Counter
            counter.innerText = `Slots available: ${MAX_SLOTS - accounts.length}/${MAX_SLOTS}`;
            if (accounts.length >= MAX_SLOTS) {
                addBtn.disabled = true;
                addBtn.innerHTML = `<i class="fa-solid fa-lock"></i> Limit Reached (${MAX_SLOTS}/${MAX_SLOTS})`;
            } else {
                addBtn.disabled = false;
                addBtn.innerHTML = '<i class="fa-solid fa-plus-circle"></i> Add Authenticator';
            }
        }

        function updateAllCodes() {
            if(accounts.length === 0) return;

            let epoch = Math.floor(Date.now() / 1000);
            let remainingTime = 30 - (epoch % 30);
            let futureTime = Date.now() + 30000;

            document.getElementById('countdownText').innerText = remainingTime + "s";
            let bar = document.getElementById('progressBar');
            bar.style.width = ((remainingTime / 30) * 100) + "%";

            let isDanger = remainingTime <= 5;
            if (isDanger) bar.classList.add('danger');
            else bar.classList.remove('danger');

            accounts.forEach((acc, index) => {
                try {
                    let totp = new OTPAuth.TOTP({
                        algorithm: 'SHA1', digits: 6, period: 30,
                        secret: OTPAuth.Secret.fromBase32(acc.secret)
                    });

                    let cCode = totp.generate();
                    let nCode = totp.generate({ timestamp: futureTime });
                    
                    let formattedCurrent = cCode.slice(0,3) + ' ' + cCode.slice(3);
                    let formattedNext = nCode.slice(0,3) + ' ' + nCode.slice(3);

                    let currElement = document.getElementById(`curr-${index}`);
                    currElement.innerText = formattedCurrent;
                    document.getElementById(`next-${index}`).innerText = formattedNext;

                    if(isDanger) currElement.style.color = 'var(--danger)';
                    else currElement.style.color = 'var(--primary)';

                } catch(e) {
                    document.getElementById(`curr-${index}`).innerText = "ERROR";
                }
            });
        }

        function deleteAccount(index) {
            accounts.splice(index, 1);
            saveAccounts();
            renderAccounts();
            showToast("Account removed!");
        }

        function resetAllAccounts() {
            if(accounts.length === 0) {
                showToast("List is already empty!", true);
                return;
            }
            if(confirm("Are you sure you want to delete all 2FA accounts from this device?")) {
                accounts = [];
                saveAccounts();
                renderAccounts();
                showToast("All accounts cleared!");
            }
        }

        function saveAccounts() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
        }
        function loadAccounts() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                accounts = JSON.parse(saved);
            }
            renderAccounts(); 
        }

        function copyCode(elementId) {
            let text = document.getElementById(elementId).innerText;
            if(text === "------" || text === "ERROR") return;
            
            let rawCode = text.replace(' ', '');
            
            navigator.clipboard.writeText(rawCode).then(() => {
                showToast("Code copied to clipboard!");
            });
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toastMsg');
            const icon = isError ? '<i class="fa-solid fa-circle-exclamation" style="color: var(--danger);"></i>' : '<i class="fa-solid fa-circle-check" style="color: var(--success);"></i>';
            
            toast.innerHTML = `${icon} <span>${message}</span>`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
