<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart 2FA | The Ironic Bro</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.2.2/otpauth.umd.min.js"></script>

    <style>
        /* --- Global Styles (TIB Smart Light Mode) --- */
        :root {
            --bg-body: #f8fafc;       
            --bg-card: #ffffff;       
            --primary: #4f46e5;       
            --primary-hover: #4338ca; 
            --text-main: #0f172a;     
            --text-muted: #64748b;    
            --border: #e2e8f0;        
            --success: #10b981;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body { 
            background-color: var(--bg-body); 
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main); 
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

        /* --- Main Content --- */
        .container { 
            margin-top: 80px; 
            width: 100%; max-width: 600px; 
            padding: 0 20px; 
            flex: 1; 
            margin-bottom: 50px;
        }
        
        .section-title { 
            font-size: 2rem; 
            margin-bottom: 30px; 
            border-left: 5px solid var(--primary); 
            padding-left: 15px; 
            font-weight: 700; 
            color: var(--text-main);
        }

        /* --- Tool Card --- */
        .tool-card {
            background: var(--bg-card); 
            border: 1px solid var(--border);
            border-radius: 16px; 
            padding: 30px;
            box-shadow: var(--shadow-md);
        }

        /* --- Input & Controls --- */
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-main); font-size: 0.95rem; }
        
        input[type="text"] { 
            width: 100%; padding: 14px 15px; 
            border-radius: 10px; border: 2px solid var(--border); 
            font-size: 1rem; color: var(--text-main); transition: 0.3s; 
            font-family: monospace; letter-spacing: 1px;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
        
        .action-btns { display: flex; gap: 15px; margin-bottom: 20px; }
        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 10px;
            font-size: 1rem; font-weight: 600; cursor: pointer; 
            transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-primary { background: var(--primary); color: white; box-shadow: var(--shadow-sm); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .btn-danger { background: #fff; color: var(--danger); border: 2px solid #fee2e2; }
        .btn-danger:hover { background: #fee2e2; }

        /* --- Result Area --- */
        .result-box {
            display: none;
            background: var(--bg-body);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .code-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .code-info h4 { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .code-display { font-size: 2.5rem; font-weight: 700; color: var(--primary); letter-spacing: 4px; font-family: monospace; }
        
        .btn-copy { 
            background: var(--bg-card); border: 1px solid var(--border); 
            color: var(--text-main); width: 45px; height: 45px; 
            border-radius: 10px; cursor: pointer; font-size: 1.2rem; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm);
        }
        .btn-copy:hover { border-color: var(--primary); color: var(--primary); transform: scale(1.05); }

        /* Next Code Area */
        .next-code-box {
            background: var(--bg-card); border: 1px dashed var(--border);
            padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .next-code-info h4 { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 2px; }
        .next-code-display { font-size: 1.4rem; font-weight: 600; color: var(--text-muted); letter-spacing: 2px; font-family: monospace; }

        /* Timer UI */
        .timer-wrapper { margin-top: 20px; }
        .timer-text { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); display: flex; justify-content: space-between; margin-bottom: 8px; }
        .progress-container { width: 100%; height: 8px; background: var(--border); border-radius: 10px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--success); width: 100%; transition: width 1s linear, background 0.3s; }
        .progress-bar.danger { background: var(--danger); }

        /* --- Toast Notification --- */
        .toast {
            position: fixed; bottom: -60px; left: 50%; transform: translateX(-50%);
            background: var(--text-main); color: #fff; padding: 12px 25px;
            border-radius: 50px; font-size: 0.9rem; font-weight: 500;
            box-shadow: var(--shadow-lg); transition: bottom 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000; display: flex; align-items: center; gap: 10px;
        }
        .toast.show { bottom: 30px; }

        /* --- Footer --- */
        footer {
            width: 100%; padding: 25px 15px; text-align: center; background: #ffffff;
            border-top: 1px solid var(--border); margin-top: auto; font-size: 14px; color: var(--text-muted);
        }
        .footer-content strong { color: var(--text-main); }
    </style>
</head>
<body>

    <div id="header"></div>
    <script type="text/javascript" src="/js/header.js"></script>

    <div class="container">
        <div class="section-title">2FA Authenticator</div>

        <div class="tool-card">
            <div class="input-group">
                <label for="secretKey"><i class="fa-solid fa-key"></i> Secret Key</label>
                <input type="text" id="secretKey" placeholder="Paste your base32 secret here..." autocomplete="off">
            </div>
            
            <div class="action-btns">
                <button class="btn btn-primary" onclick="startApp()"><i class="fa-solid fa-shield-check"></i> Generate</button>
                <button class="btn btn-danger" onclick="resetApp()"><i class="fa-solid fa-trash-can"></i> Clear</button>
            </div>

            <div class="result-box" id="resultBox">
                <div class="code-row">
                    <div class="code-info">
                        <h4>Current Code</h4>
                        <div class="code-display" id="currentCode">------</div>
                    </div>
                    <button class="btn-copy" onclick="copyCode('currentCode')" title="Copy Current Code">
                        <i class="fa-solid fa-copy"></i>
                    </button>
                </div>

                <div class="next-code-box">
                    <div class="next-code-info">
                        <h4>Next Code (Preview)</h4>
                        <div class="next-code-display" id="nextCode">------</div>
                    </div>
                    <button class="btn-copy" style="width: 35px; height: 35px; font-size: 1rem;" onclick="copyCode('nextCode')" title="Copy Next Code">
                        <i class="fa-solid fa-copy"></i>
                    </button>
                </div>
                
                <div class="timer-wrapper">
                    <div class="timer-text">
                        <span>Valid for</span>
                        <span id="countdownText">30s</span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toastMsg"><i class="fa-solid fa-circle-check" style="color: var(--success);"></i> <span>Copied to clipboard!</span></div>

    <footer>
        <div class="footer-content">
            &copy; 2026 <strong>The Ironic Bro</strong><br>All rights reserved.
        </div>
    </footer>

    <script>
        let timerInterval;
        let activeSecret = '';
        const STORAGE_KEY = 'tib_2fa_secret';

        // Auto load on page start
        document.addEventListener('DOMContentLoaded', () => {
            const savedSecret = localStorage.getItem(STORAGE_KEY);
            if (savedSecret) {
                document.getElementById('secretKey').value = savedSecret;
                startApp(); 
            }
        });

        function startApp() {
            const rawInput = document.getElementById('secretKey').value;
            activeSecret = rawInput.replace(/\s+/g, '').toUpperCase();
            
            if(!activeSecret) {
                showToast("Please enter a Secret Key!", true);
                return;
            }

            // Save to LocalStorage
            localStorage.setItem(STORAGE_KEY, activeSecret);

            document.getElementById('resultBox').style.display = 'block';
            updateCodes();
            
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateCodes, 1000);
        }

        function updateCodes() {
            try {
                let totp = new OTPAuth.TOTP({
                    algorithm: 'SHA1',
                    digits: 6,
                    period: 30,
                    secret: OTPAuth.Secret.fromBase32(activeSecret)
                });
                
                // 1. Current Code
                document.getElementById('currentCode').innerText = totp.generate();
                
                // 2. Next Code (Current time er sathe 30 seconds ba 30000ms add kora)
                let futureTime = Date.now() + 30000;
                document.getElementById('nextCode').innerText = totp.generate({ timestamp: futureTime });
                
                // 3. Timer Math
                let epoch = Math.floor(Date.now() / 1000);
                let remainingTime = 30 - (epoch % 30);
                
                // UI Updates
                document.getElementById('countdownText').innerText = remainingTime + "s";
                let bar = document.getElementById('progressBar');
                bar.style.width = ((remainingTime / 30) * 100) + "%";

                if (remainingTime <= 5) {
                    bar.classList.add('danger');
                    document.getElementById('currentCode').style.color = 'var(--danger)';
                } else {
                    bar.classList.remove('danger');
                    document.getElementById('currentCode').style.color = 'var(--primary)';
                }

            } catch (error) {
                resetApp();
                showToast("Invalid Secret Key Format!", true);
            }
        }

        // Copy Function with Smart Toast
        function copyCode(elementId) {
            let code = document.getElementById(elementId).innerText;
            if(code === "------") return;

            navigator.clipboard.writeText(code).then(() => {
                showToast(elementId === 'currentCode' ? "Current code copied!" : "Next code copied!");
            });
        }

        // Custom Toast Notification Logic
        function showToast(message, isError = false) {
            const toast = document.getElementById('toastMsg');
            const icon = isError ? '<i class="fa-solid fa-circle-exclamation" style="color: var(--danger);"></i>' : '<i class="fa-solid fa-circle-check" style="color: var(--success);"></i>';
            
            toast.innerHTML = `${icon} <span>${message}</span>`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function resetApp() {
            clearInterval(timerInterval);
            document.getElementById('secretKey').value = '';
            localStorage.removeItem(STORAGE_KEY); 
            
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('currentCode').innerText = '------';
            document.getElementById('nextCode').innerText = '------';
            showToast("Key cleared from device!");
        }
    </script>
</body>
</html>
