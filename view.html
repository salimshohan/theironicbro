<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>View Post | The Ironic Bro</title>
    <meta name="description" content="Welcome to The Ironic Bro.">
    
    <meta property="og:type" content="article">
    <meta property="og:url" content="">
    <meta property="og:title" content="The Ironic Bro">
    <meta property="og:description" content="Relatable memes and student life struggles.">
    <meta property="og:image" content="https://i.postimg.cc/QtjCXTph/logo-tib.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        /* --- Global Styles (Smart Light Mode) --- */
        :root {
            --bg-body: #f8fafc;       
            --bg-card: #ffffff;       
            
            --primary: #4f46e5;       
            --primary-hover: #4338ca; 
            
            --text-main: #0f172a;     
            --text-muted: #475569;    
            --border: #e2e8f0;        
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body { 
            background-color: var(--bg-body); 
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main); 
            font-family: 'Lexend', sans-serif;
            -webkit-user-select: none; user-select: none; 
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        a { text-decoration: none; color: inherit; transition: 0.3s; }
        img { pointer-events: none; max-width: 100%; height: auto; border-radius: 12px; }

        /* --- Blog Content Styles --- */
        .content-container { 
            margin-top: 80px; 
            width: 100%; max-width: 900px; 
            padding: 40px 40px; 
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            margin-bottom: 40px;
        }

        .meta-info {
            display: flex; flex-wrap: wrap; gap: 15px 25px; align-items: center;
            font-size: 0.95rem; color: var(--text-muted);
            margin-bottom: 30px; font-weight: 500;
            padding-bottom: 20px; border-bottom: 1px solid var(--border);
        }
        .meta-info span { display: flex; align-items: center; gap: 8px; }
        .meta-info i { color: var(--primary); font-size: 1.1rem; }
        
        .author-badge {
            background: #e0e7ff; color: var(--primary-hover);
            padding: 4px 12px; border-radius: 50px; font-weight: 600;
        }

        /* Feature: Action Buttons (Listen) */
        .action-btn {
            background: #f1f5f9; color: var(--text-main);
            padding: 6px 14px; border-radius: 50px; font-weight: 600; font-size: 0.9rem;
            border: 1px solid var(--border); cursor: pointer; transition: 0.3s;
            display: inline-flex; align-items: center; gap: 6px; font-family: 'Lexend', sans-serif;
        }
        .action-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .action-btn.active { background: #ef4444; color: white; border-color: #ef4444; }

        /* Adjusted Font Size for Better Reading */
        #markdown-content { color: var(--text-muted); font-size: 1.05rem; line-height: 1.75; }
        
        #markdown-content h1 { 
            font-size: 2.3rem; margin-bottom: 15px; color: var(--text-main); 
            line-height: 1.3; font-weight: 800; letter-spacing: -0.5px;
        }
        #markdown-content h2 { 
            font-size: 1.6rem; margin-top: 35px; margin-bottom: 15px; 
            color: var(--primary); border-bottom: 2px solid var(--border); 
            padding-bottom: 8px; font-weight: 700;
        }
        #markdown-content h3 { font-size: 1.3rem; margin-top: 25px; color: var(--text-main); font-weight: 600; }
        
        #markdown-content p, #markdown-content li { margin-bottom: 18px; }
        
        #markdown-content img { 
            width: 100%; border-radius: 16px; margin: 30px 0; 
            box-shadow: var(--shadow-md); 
        }
        #markdown-content blockquote { 
            border-left: 5px solid var(--primary); padding: 15px 20px; 
            color: var(--text-main); font-style: italic; font-weight: 500;
            background: #f8fafc; border-radius: 0 12px 12px 0; margin: 25px 0; 
        }

        /* Smart Code Block with Copy Button */
        .code-wrapper { position: relative; margin: 25px 0; }
        #markdown-content pre { margin: 0; background: #1e293b; padding: 15px; border-radius: 10px; overflow-x: auto; }
        #markdown-content pre code { background: transparent; padding: 0; color: #e2e8f0; border: none; font-size: 0.95rem; }
        
        /* Inline code */
        #markdown-content code { 
            background: #f1f5f9; padding: 3px 6px; border-radius: 6px; 
            font-family: 'Courier New', Courier, monospace; color: var(--primary-hover); font-weight: 600;
            border: 1px solid var(--border);
        }

        .copy-code-btn {
            position: absolute; top: 10px; right: 10px;
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f8fafc; font-size: 0.8rem; padding: 5px 10px; border-radius: 6px; 
            cursor: pointer; transition: 0.3s; font-family: 'Lexend', sans-serif; font-weight: 500;
            display: flex; align-items: center; gap: 5px;
        }
        .copy-code-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* --- Tags & Share Button --- */
        .article-footer {
            margin-top: 40px; padding-top: 25px;
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;
        }

        .post-tags { display: flex; gap: 10px; flex-wrap: wrap; }
        .tag-item {
            background: var(--bg-body); border: 1px solid var(--border);
            color: var(--text-muted); font-size: 0.85rem; font-weight: 600;
            padding: 5px 12px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        
        .share-btn {
            background: var(--text-main); color: #fff; 
            padding: 10px 20px; border-radius: 50px; border: none;
            font-weight: 600; cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; gap: 8px; font-family: 'Lexend', sans-serif;
            box-shadow: var(--shadow-sm);
        }
        .share-btn:hover { background: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .share-btn.copied { background: #10b981; color: white; }

        /* --- Relevant Posts Section --- */
        .related-section { width: 100%; max-width: 1100px; padding: 0 20px; margin-bottom: 50px; flex: 1; }
        .section-title { font-size: 1.8rem; margin-bottom: 30px; border-left: 5px solid var(--primary); padding-left: 15px; font-weight: 700; color: var(--text-main); }

        .blog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }

        .blog-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; overflow: hidden; position: relative; cursor: pointer;
            transition: all 0.3s ease; box-shadow: var(--shadow-sm);
        }
        .blog-card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: var(--shadow-lg); }
        .blog-img { width: 100%; height: 220px; object-fit: cover; transition: transform 0.5s ease; }
        .blog-card:hover .blog-img { transform: scale(1.05); }
        
        .blog-content { padding: 25px; background: #fff; position: relative; z-index: 2; }
        .blog-date { font-size: 0.85rem; color: var(--primary); margin-bottom: 10px; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
        .blog-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 10px; line-height: 1.4; color: var(--text-main); }
        .blog-desc { font-size: 0.95rem; color: var(--text-muted); line-height: 1.6; }

        /* --- Footer --- */
        footer {
            width: 100%; padding: 25px 15px; text-align: center;
            background: #ffffff; border-top: 1px solid var(--border);
            margin-top: auto; font-size: 14px; color: var(--text-muted);
        }
        .footer-content { font-weight: 500; }
        .footer-content strong { color: var(--text-main); }

        /* --- Floating Back to Top --- */
        .back-to-top {
            position: fixed; bottom: 30px; right: 30px;
            width: 50px; height: 50px;
            background: linear-gradient(135deg, var(--primary), #6366f1);
            color: white; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; cursor: pointer; border: none; z-index: 1000;
            opacity: 0; visibility: hidden; transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
        }
        .back-to-top.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .back-to-top:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.6);
        }

        @media (max-width: 768px) {
            .content-container { margin-top: 60px; padding: 25px 20px; border-radius: 0; border-left: none; border-right: none; }
            #markdown-content h1 { font-size: 2rem; }
            .back-to-top { bottom: 20px; right: 20px; width: 45px; height: 45px; }
            .article-footer { flex-direction: column; align-items: flex-start; }
            .share-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="header"></div>
    <script type="text/javascript" src="/js/header.js"></script>

    <div class="content-container">
        <div id="postMeta" class="meta-info" style="display: none;">
            <span id="postAuthor" class="author-badge"><i class="fas fa-user-edit"></i> Salim Hosen Shohan</span>
            <span id="postDate"><i class="far fa-calendar-alt"></i> Date</span>
            <span id="readTime"><i class="far fa-clock"></i> 2 mins read</span>
            
            <button class="action-btn" id="listenBtn" onclick="toggleSpeech()">
                <i class="fas fa-volume-up"></i> Listen
            </button>
        </div>

        <div id="markdown-content">
            <p style="color: var(--text-muted); text-align: center; margin-top: 50px;">
                <i class="fas fa-spinner fa-spin"></i> Fetching details...
            </p>
        </div>

        <div class="article-footer" id="articleFooter" style="display: none;">
            <div class="post-tags" id="postTags">
                </div>
            <button class="share-btn" id="shareBtn" onclick="copyLink()">
                <i class="fas fa-link"></i> Copy Link
            </button>
        </div>
    </div>

    <div class="related-section">
        <div class="section-title">More Fresh Drops</div>
        <div class="blog-grid" id="relatedContainer">
            </div>
    </div>

    <footer>
        <div class="footer-content">
            &copy; 2026 <strong>The Ironic Bro</strong><br>All rights reserved.
        </div>
    </footer>

    <button id="backToTopBtn" class="back-to-top" onclick="scrollToTop()" title="Back to Top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script>
        // --- Back to Top Logic ---
        const backToTopBtn = document.getElementById('backToTopBtn');
        window.addEventListener('scroll', () => {
            let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            if (winScroll > 300) {
                backToTopBtn.classList.add('show');
            } else {
                backToTopBtn.classList.remove('show');
            }
        });

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- Prevent Copy ---
        document.onkeydown = function(e) {
            if(event.keyCode == 123) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        }

        // --- Share Link Feature ---
        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            const btn = document.getElementById('shareBtn');
            btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-link"></i> Copy Link';
                btn.classList.remove('copied');
            }, 3000);
        }

        // --- Read Time Calculator (Updated for Mins) ---
        function calculateReadTime(text) {
            const wordsPerMinute = 200;
            const words = text.trim().split(/\s+/).length;
            const time = Math.ceil(words / wordsPerMinute);
            // Updated logic here
            return time <= 1 ? "1 min read" : `${time} mins read`;
        }

        // --- Listen Feature (Text-to-Speech) ---
        let isSpeaking = false;
        let synth = window.speechSynthesis;

        function toggleSpeech() {
            const btn = document.getElementById('listenBtn');
            
            if (isSpeaking) {
                synth.cancel();
                isSpeaking = false;
                btn.innerHTML = '<i class="fas fa-volume-up"></i> Listen';
                btn.classList.remove('active');
            } else {
                // Get text excluding the code blocks for better listening
                let contentDiv = document.getElementById('markdown-content').cloneNode(true);
                let preTags = contentDiv.querySelectorAll('pre');
                preTags.forEach(tag => tag.remove());
                
                let text = contentDiv.innerText;
                let utterance = new SpeechSynthesisUtterance(text);
                
                utterance.onend = () => {
                    isSpeaking = false;
                    btn.innerHTML = '<i class="fas fa-volume-up"></i> Listen';
                    btn.classList.remove('active');
                };
                
                synth.speak(utterance);
                isSpeaking = true;
                btn.innerHTML = '<i class="fas fa-stop"></i> Stop';
                btn.classList.add('active');
            }
        }

        // --- Format Code Blocks (Add Copy Button) ---
        function addCodeCopyButtons() {
            document.querySelectorAll('pre code').forEach((block) => {
                const pre = block.parentNode;
                
                const wrapper = document.createElement('div');
                wrapper.className = 'code-wrapper';
                
                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(pre);

                const btn = document.createElement('button');
                btn.className = 'copy-code-btn';
                btn.innerHTML = '<i class="far fa-copy"></i> Copy';
                
                btn.onclick = () => {
                    navigator.clipboard.writeText(block.innerText);
                    btn.innerHTML = '<i class="fas fa-check"></i> Copied';
                    btn.style.background = '#10b981';
                    btn.style.borderColor = '#10b981';
                    setTimeout(() => {
                        btn.innerHTML = '<i class="far fa-copy"></i> Copy';
                        btn.style.background = 'rgba(255, 255, 255, 0.1)';
                        btn.style.borderColor = 'rgba(255, 255, 255, 0.2)';
                    }, 2000);
                };
                wrapper.appendChild(btn);
            });
        }

        // --- Post Loading & Formatting Logic ---
        const urlParams = new URLSearchParams(window.location.search);
        const currentPostFile = urlParams.get('post');

        function updatePageMeta(title, image, desc) {
            document.title = title + " | The Ironic Bro";
            const metas = {
                "og:title": title + " | The Ironic Bro",
                "og:description": desc || "Relatable student memes and stories.",
                "og:image": image || "https://i.postimg.cc/QtjCXTph/logo-tib.png",
                "og:url": window.location.href
            };

            for (let property in metas) {
                let meta = document.querySelector(`meta[property='${property}']`);
                if (meta) {
                    meta.setAttribute("content", metas[property]);
                } else {
                    meta = document.createElement('meta');
                    meta.setAttribute('property', property);
                    meta.setAttribute('content', metas[property]);
                    document.head.appendChild(meta);
                }
            }
        }

        async function initPage() {
            try {
                const response = await fetch('posts.json');
                if (!response.ok) throw new Error("JSON not found");
                const allPosts = await response.json();

                const currentPost = allPosts.find(p => p.link.includes(currentPostFile));

                // A. Render Current Post
                if(currentPostFile) {
                    try {
                        if (currentPost) {
                            updatePageMeta(currentPost.title, currentPost.image, currentPost.excerpt);
                            
                            const authorName = currentPost.author ? currentPost.author : "Salim Hosen Shohan";
                            document.getElementById('postAuthor').innerHTML = `<i class="fas fa-user-edit"></i> ${authorName}`;
                            document.getElementById('postDate').innerHTML = `<i class="far fa-calendar-alt"></i> ${currentPost.date}`;

                            const tagsContainer = document.getElementById('postTags');
                            if (currentPost.tags && currentPost.tags.length > 0) {
                                tagsContainer.innerHTML = currentPost.tags.map(tag => `<span class="tag-item">#${tag}</span>`).join('');
                            } else {
                                tagsContainer.innerHTML = `<span class="tag-item">#TIB</span> <span class="tag-item">#Meme</span>`;
                            }
                        }

                        const postRes = await fetch(`blog/${currentPostFile}`);
                        if(!postRes.ok) throw new Error("Markdown not found");
                        const text = await postRes.text();
                        
                        // Show Content
                        document.getElementById('markdown-content').innerHTML = marked.parse(text);
                        document.getElementById('postMeta').style.display = 'flex';
                        document.getElementById('articleFooter').style.display = 'flex';
                        document.getElementById('readTime').innerHTML = `<i class="far fa-clock"></i> ${calculateReadTime(text)}`;
                        
                        // Add Copy Buttons to Code blocks
                        addCodeCopyButtons();

                    } catch (err) {
                        document.getElementById('markdown-content').innerHTML = `
                            <div style="text-align:center; padding: 50px;">
                                <h2 style="color: var(--primary);">404 Not Found</h2>
                                <p style="color: var(--text-muted);">The post was deleted or moved.</p>
                                <a href="index.html" style="color: var(--text-main); font-weight: bold; margin-top: 20px; display: inline-block; text-decoration: underline;">Go Home</a>
                            </div>`;
                    }
                } else {
                    document.getElementById('markdown-content').innerHTML = `
                        <div style="text-align:center;">
                            <h2 style="color: var(--text-muted);">No post selected</h2>
                            <a href="index.html" style="color: var(--primary); font-weight: bold; text-decoration: underline;">Go back to Home</a>
                        </div>`;
                }

                // B. Render Random Related Posts
                const relatedContainer = document.getElementById('relatedContainer');
                let relevantPosts = allPosts.filter(p => !p.link.includes(currentPostFile));
                
                relevantPosts.sort(() => Math.random() - 0.5);
                const randomPosts = relevantPosts.slice(0, 6); 

                if(randomPosts.length > 0) {
                    randomPosts.forEach(post => {
                        const card = `
                            <div class="blog-card" onclick="window.location.href='${post.link}'">
                                <img src="${post.image}" alt="${post.title}" class="blog-img">
                                <div class="blog-content">
                                    <div class="blog-date">${post.date}</div>
                                    <h3 class="blog-title">${post.title}</h3>
                                    <p class="blog-desc">${post.excerpt}</p>
                                </div>
                            </div>
                        `;
                        relatedContainer.innerHTML += card;
                    });
                } else {
                    document.querySelector('.related-section').style.display = 'none';
                }

            } catch (error) {
                console.error("Error initializing page:", error);
            }
        }

        // Cancel Speech on page leave
        window.onbeforeunload = () => { if(isSpeaking) synth.cancel(); };

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
