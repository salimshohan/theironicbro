<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ironic Bro - Watermark Tool</title>
    <style>
        /* Modern UI Styling */
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #334155;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card);
            width: 100%;
            max-width: 1000px;
            border-radius: 20px;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.1);
            padding: 2rem;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
        }

        h1 {
            grid-column: 1 / -1;
            margin: 0 0 1rem 0;
            color: var(--primary-dark);
            font-size: 1.5rem;
            text-align: center;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 1rem;
        }

        /* Sidebar Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            height: fit-content;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], 
        input[type="number"], 
        select {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            background: #fff;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* Custom Color Input */
        .color-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border);
            padding: 5px;
            border-radius: 8px;
        }
        
        input[type="color"] {
            border: none;
            width: 40px;
            height: 40px;
            cursor: pointer;
            background: none;
        }

        /* Sliders */
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 5px;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            transition: background .15s ease-in-out;
        }

        /* File Upload */
        .upload-box {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #f8fafc;
        }
        
        .upload-box:hover {
            border-color: var(--primary);
            background: #f0fdfa;
        }

        /* Preview Area */
        .preview-wrapper {
            background: #e2e8f0; 
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            position: relative;
            overflow: hidden;
        }

        #previewImage {
            max-width: 100%;
            max-height: 500px;
            display: block;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn-download {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 1rem;
            display: block;
            transition: 0.2s;
        }
        
        .btn-download:hover {
            background: var(--primary-dark);
        }

        .hidden { display: none; }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Watermark Generator</h1>

    <div class="controls">
        
        <div class="upload-box" onclick="document.getElementById('imageInput').click()">
            <p>📁 Click to Upload Image</p>
            <input type="file" id="imageInput" accept="image/*" class="hidden">
        </div>

        <div class="control-group">
            <label>Watermark Text</label>
            <input type="text" id="wmText" value="@theironicbro">
        </div>

        <div class="control-group">
            <label>Position</label>
            <select id="wmPosition">
                <option value="bottom-right">Bottom Right</option>
                <option value="bottom-left">Bottom Left</option>
                <option value="top-right">Top Right</option>
                <option value="top-left">Top Left</option>
                <option value="center">Center</option>
                <option value="top-center">Top Center</option>
                <option value="bottom-center">Bottom Center</option>
            </select>
        </div>

        <div class="control-group">
            <label>Offset X (Left/Right)</label>
            <input type="range" id="offsetX" min="-100" max="100" value="0">
        </div>
        <div class="control-group">
            <label>Offset Y (Up/Down)</label>
            <input type="range" id="offsetY" min="-100" max="100" value="0">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="control-group">
                <label>Color</label>
                <div class="color-wrapper">
                    <input type="color" id="wmColor" value="#ffffff">
                    <span style="font-size: 12px;">Pick</span>
                </div>
            </div>
            <div class="control-group">
                <label>Size (px)</label>
                <input type="number" id="wmSize" value="40">
            </div>
        </div>

        <div class="control-group">
            <label>Opacity</label>
            <input type="range" id="wmOpacity" min="0.1" max="1" step="0.1" value="0.8">
        </div>

        <a id="downloadBtn" class="btn-download hidden" download="watermarked.png">Download Image</a>
    </div>

    <div class="preview-wrapper">
        <p id="placeholder" style="color: #64748b;">No image selected</p>
        <img id="previewImage" class="hidden">
        <canvas id="canvas" class="hidden"></canvas>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const previewImage = document.getElementById('previewImage');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');
    
    // Inputs
    const wmText = document.getElementById('wmText');
    const wmPosition = document.getElementById('wmPosition');
    const offsetX = document.getElementById('offsetX');
    const offsetY = document.getElementById('offsetY');
    const wmColor = document.getElementById('wmColor');
    const wmSize = document.getElementById('wmSize');
    const wmOpacity = document.getElementById('wmOpacity');

    let uploadedImage = new Image();

    // 1. Image Upload
    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if(!file) return;
        
        const reader = new FileReader();
        reader.onload = (event) => {
            uploadedImage.src = event.target.result;
            uploadedImage.onload = () => {
                document.getElementById('placeholder').classList.add('hidden');
                previewImage.classList.remove('hidden');
                downloadBtn.classList.remove('hidden');
                renderWatermark();
            }
        }
        reader.readAsDataURL(file);
    });

    // 2. Add Listeners to all inputs
    [wmText, wmPosition, offsetX, offsetY, wmColor, wmSize, wmOpacity].forEach(input => {
        input.addEventListener('input', renderWatermark);
    });

    // 3. Render Function
    function renderWatermark() {
        if (!uploadedImage.src) return;

        // Set canvas size
        canvas.width = uploadedImage.width;
        canvas.height = uploadedImage.height;

        // Draw original image
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(uploadedImage, 0, 0);

        // Configure Text
        const fontSize = parseInt(wmSize.value);
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.fillStyle = wmColor.value;
        ctx.globalAlpha = parseFloat(wmOpacity.value);
        
        // Shadow for better visibility
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.shadowBlur = 4;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;

        const text = wmText.value;
        const padding = 20;
        const offX = parseInt(offsetX.value);
        const offY = parseInt(offsetY.value);
        
        let x, y;

        // Calculate Position
        ctx.textBaseline = 'middle'; // Default baseline
        
        switch(wmPosition.value) {
            case 'top-left':
                ctx.textAlign = 'left';
                x = padding + offX;
                y = padding + offY + (fontSize/2);
                break;
            case 'top-right':
                ctx.textAlign = 'right';
                x = canvas.width - padding + offX;
                y = padding + offY + (fontSize/2);
                break;
            case 'top-center':
                ctx.textAlign = 'center';
                x = (canvas.width / 2) + offX;
                y = padding + offY + (fontSize/2);
                break;
            case 'bottom-left':
                ctx.textAlign = 'left';
                x = padding + offX;
                y = canvas.height - padding + offY - (fontSize/2);
                break;
            case 'bottom-right':
                ctx.textAlign = 'right';
                x = canvas.width - padding + offX;
                y = canvas.height - padding + offY - (fontSize/2);
                break;
            case 'bottom-center':
                ctx.textAlign = 'center';
                x = (canvas.width / 2) + offX;
                y = canvas.height - padding + offY - (fontSize/2);
                break;
            case 'center':
                ctx.textAlign = 'center';
                x = (canvas.width / 2) + offX;
                y = (canvas.height / 2) + offY;
                break;
        }

        ctx.fillText(text, x, y);

        // Update Preview
        previewImage.src = canvas.toDataURL();
        downloadBtn.href = canvas.toDataURL();
    }
</script>

</body>
</html>
